[project]
name = "infergate"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible AI gateway for local models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.6.0",
    "diffusers>=0.37.0",
    "transformers>=4.48.0",
    "accelerate>=1.2.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "vllm>=0.19.0",
]
quant = [
    # NF4 / int4 weight quantization via diffusers PipelineQuantizationConfig
    "bitsandbytes>=0.43.0",
    # FP8 weight quantization via optimum-quanto backend
    "optimum-quanto>=0.2.5",
]
tts = [
    "kokoro>=0.7.0",
    "soundfile>=0.12.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]
all = ["infergate[gpu,tts,monitoring,quant,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade (modernize syntax)
    "B",     # flake8-bugbear (common bugs)
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async (async pitfalls)
    "C4",    # flake8-comprehensions
    "T20",   # flake8-print (no print in production)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",    # line length — handled by formatter
    # Unicode typography (×, –, −) is used deliberately in Russian/technical
    # prose across docstrings and comments; flagging it is pure noise.
    "RUF002",
    "RUF003",
    # NamedTemporaryFile(delete=False) + manual unlink in finally is the
    # correct idiom when passing a temp path to an external library (TTS
    # engines, whisper) — SIM115 has no way to distinguish it from a leak.
    "SIM115",
]

[tool.ruff.lint.flake8-bugbear]
# Depends/Query/Body/Header/Cookie/File/Form are FastAPI idioms that must
# appear in default arguments — they are not real side-effects at import time.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
