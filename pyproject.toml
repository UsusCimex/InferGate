[project]
name = "infergate"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible AI gateway for local models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.43.0",
    "pyyaml>=6.0.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "aiosqlite>=0.22.0",
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.6.0",
    "diffusers>=0.37.0",
    "transformers>=4.48.0",
    "accelerate>=1.2.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "vllm>=0.19.0",
    "torchsde>=0.2.6",
]
quant = [
    "bitsandbytes>=0.43.0",
    "optimum-quanto>=0.2.5",
]
tts = [
    "kokoro>=0.7.0",
    "soundfile>=0.12.0",
]
embedding = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.48.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "pillow>=10.0",
    "sentencepiece>=0.2.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
redis = [
    "redis>=5.0",
]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.1",
    "ruff>=0.13.0",
    "pillow>=10.0",
    "psutil>=5.9",
    "prometheus-client>=0.21.0",
    "redis>=5.0",
    "fakeredis[lua]>=2.20",
]
all = ["infergate[gpu,tts,embedding,monitoring,quant,redis,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "T20", "RUF",
]
ignore = [
    "E501",
    "RUF002",
    "RUF003",
    "SIM115",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
