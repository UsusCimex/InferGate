[project]
name = "infergate"
version = "0.1.0"
description = "Self-hosted OpenAI-compatible AI gateway for local models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.6.0",
    "diffusers>=0.37.0",
    "transformers>=4.48.0",
    "accelerate>=1.2.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "vllm>=0.19.0",
]
quant = [
    "bitsandbytes>=0.43.0",
    "optimum-quanto>=0.2.5",
]
tts = [
    "kokoro>=0.7.0",
    "soundfile>=0.12.0",
]
embedding = [
    "sentence-transformers>=2.7.0",
    "transformers>=4.48.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
]
monitoring = [
    "prometheus-client>=0.20.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "pillow>=10.0",
    "psutil>=5.9",
    "prometheus-client>=0.20.0",
]
all = ["infergate[gpu,tts,embedding,monitoring,quant,dev]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "ASYNC", "C4", "T20", "RUF",
]
ignore = [
    "E501",
    "RUF002",
    "RUF003",
    "SIM115",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Path",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
