# Example override file for a server-class host (24GB+ GPU, no offload).
#
# Usage:
#   cp deploy/docker-compose.server.example.yml deploy/docker-compose.server.yml
#   edit deploy/docker-compose.server.yml
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.server.yml \
#                  --profile image --profile text up -d
#
# Compose merges files left-to-right; keys here are applied on top of the base.
# `environment:` and `deploy:` are merged by key, so you only write what differs.
#
# Prefer tuning via deploy/.env (simple key=value) when the change applies to
# all hosts. Use this file for host-specific layout: volumes, pinned-model
# overrides, profile defaults. The GPU of a model is <ID>_GPU in deploy/.env,
# which the gateway reads as well.

services:
  worker-qwen-image:
    environment:
      QWEN_IMAGE_QUANTIZATION: "null"
      QWEN_IMAGE_OFFLOAD: "none"
      QWEN_IMAGE_MAX_CONCURRENT: "2"

  worker-flux1-dev:
    environment:
      FLUX1_DEV_OFFLOAD: "none"
      FLUX1_DEV_STEPS: "50"
