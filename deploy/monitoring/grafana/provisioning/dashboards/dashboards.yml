# Auto-provision dashboards from /var/lib/grafana/dashboards on startup.
# Any *.json dropped in that directory is loaded and kept in sync (updateIntervalSeconds).
apiVersion: 1

providers:
  - name: "InferGate"
    orgId: 1
    folder: "InferGate"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
