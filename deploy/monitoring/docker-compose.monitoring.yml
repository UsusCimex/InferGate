# Monitoring stack: Prometheus + Grafana
# Usage (from project root):
#   docker compose -f deploy/docker-compose.yml -f deploy/monitoring/docker-compose.monitoring.yml --profile text up -d
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000 (admin/admin)

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Auto-provisioned datasource + dashboard-provider configs.
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON directory referenced by dashboards.yml (`options.path`).
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Suppress the first-run password change nag — provisioning is idempotent.
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
