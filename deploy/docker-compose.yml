  # ─── Image workers (diffusers) ───────────────────────────────────────
  worker-sd35-medium:
    <<: *gpu
    profiles: ["image", "sd35-medium"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        WORKER_REQUIREMENTS: deploy/workers/sd35-medium/requirements.txt
    volumes:
      - ../config/models/sd35-medium.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-sdxl-base:
    <<: *gpu
    profiles: ["sdxl-base"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        WORKER_REQUIREMENTS: deploy/workers/sdxl-base/requirements.txt
    volumes:
      - ../config/models/sdxl-base.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-flux1-dev:
    <<: *gpu
    profiles: ["flux1-dev"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        WORKER_REQUIREMENTS: deploy/workers/flux1-dev/requirements.txt
    volumes:
      - ../config/models/flux1-dev.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-flux1-schnell:
    <<: *gpu
    profiles: ["flux1-schnell"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: build-essential
        WORKER_REQUIREMENTS: deploy/workers/flux1-schnell/requirements.txt
    volumes:
      - ../config/models/flux1-schnell.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-flux2-klein-4b:
    <<: *gpu
    profiles: ["flux2-klein-4b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        WORKER_REQUIREMENTS: deploy/workers/flux2-klein-4b/requirements.txt
    volumes:
      - ../config/models/flux2-klein-4b.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
