  # ─── TTS workers ─────────────────────────────────────────────────────
  worker-kokoro-82m:
    restart: unless-stopped
    profiles: ["tts", "kokoro-82m"]
    build:
      <<: *build
      args:
        BASE_IMAGE: python:3.12-slim
        APT_PACKAGES: gcc
        WORKER_REQUIREMENTS: deploy/workers/kokoro-82m/requirements.txt
        POST_INSTALL: python -m spacy download en_core_web_sm
    volumes:
