    volumes:
      - ../config/models/qwen3-8b.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-text

  worker-llama3-1-8b:
    <<: *gpu
    profiles: ["llama3.1-8b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.19.0}
