      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-meissonic:
    <<: *gpu
    profiles: ["meissonic"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: git
        WORKER_REQUIREMENTS: deploy/workers/meissonic/requirements.txt
        POST_INSTALL: "git clone --depth=1 https://github.com/viiika/Meissonic.git /app/_meissonic"
    volumes:
      - ../config/models/meissonic.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
