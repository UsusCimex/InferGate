# Per-model Docker deployment — one unified Dockerfile, one matrix, many workers.
#
# Build (single service, via compose):
#   docker compose -f deploy/docker-compose.yml build worker-qwen-image
# Build (batch, via bake — preferred for >1 model):
#   docker buildx bake -f deploy/docker-bake.hcl
#
# Run (from project root so .env is picked up):
#   docker compose -f deploy/docker-compose.yml --profile text --profile tts up -d
#   docker compose -f deploy/docker-compose.yml --profile qwen-image up -d
#   docker compose -f deploy/docker-compose.yml --profile text --profile image --profile tts up -d
#
# Adding a new model:
#   1. config/models/<id>.yaml                         — model config
#   2. deploy/workers/<id>/requirements.txt            — per-model pip deps
#   3. One entry in the matrix in deploy/docker-bake.hcl
#   4. One service stanza here (copy a similar one)
#
# Base-image overrides (env vars; put them in deploy/.env):
#   VLLM_IMAGE=vllm/vllm-openai:v0.19.0
#   GPU_BASE_IMAGE=pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime
#   (for RTX 30xx/40xx: pytorch/pytorch:2.6.0-cuda12.6-cudnn9-runtime)

# ─── Reusable YAML fragments ────────────────────────────────────────────
# env_file: .env — tunables for each model (quantisation, offload, steps,
# concurrency, etc.) come from deploy/.env. The model YAMLs read them via
# OmegaConf `${oc.env:VAR,default}`. See deploy/.env.example.
x-env-file: &env-file
  - path: .env
    required: false

x-env: &env
  WORKER_MODEL_CONFIG: /app/config/model.yaml
  WORKER_MODELS_DIR: /app/models
  HF_TOKEN: ${HF_TOKEN:-}
  HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
  # Disable expandable_segments — incompatible with enable_model_cpu_offload
  # on Blackwell/WSL2 (triggers CUDACachingAllocator handles_.at assert).
  # Override to "expandable_segments:True" only if you need it.
  PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-}

x-hc-text: &hc-text
  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 180s

x-hc-image: &hc-image
  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  interval: 30s
  timeout: 10s
  retries: 10
  start_period: 600s

x-hc-tts: &hc-tts
  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 30s

x-hc-tts-gpu: &hc-tts-gpu
  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 120s

x-gpu: &gpu
  restart: unless-stopped
  shm_size: "1g"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile.worker

services:
  # ─── Gateway ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - WORKER_URL_QWEN3_5_4B=http://worker-qwen3-5-4b:8001
      - WORKER_URL_QWEN3_5_9B=http://worker-qwen3-5-9b:8001
      - WORKER_URL_QWEN3_8B=http://worker-qwen3-8b:8001
      - WORKER_URL_LLAMA3_1_8B=http://worker-llama3-1-8b:8001
      - WORKER_URL_SD35_MEDIUM=http://worker-sd35-medium:8001
      - WORKER_URL_SDXL_BASE=http://worker-sdxl-base:8001
      - WORKER_URL_FLUX1_DEV=http://worker-flux1-dev:8001
      - WORKER_URL_FLUX1_SCHNELL=http://worker-flux1-schnell:8001
      - WORKER_URL_FLUX2_KLEIN_4B=http://worker-flux2-klein-4b:8001
      - WORKER_URL_QWEN_IMAGE=http://worker-qwen-image:8001
      - WORKER_URL_Z_IMAGE_TURBO=http://worker-z-image-turbo:8001
      - WORKER_URL_HUNYUAN_DIT=http://worker-hunyuan-dit:8001
      - WORKER_URL_JANUS_PRO_1B=http://worker-janus-pro-1b:8001
      - WORKER_URL_JANUS_PRO_7B=http://worker-janus-pro-7b:8001
      - WORKER_URL_MEISSONIC=http://worker-meissonic:8001
      - WORKER_URL_KOKORO_82M=http://worker-kokoro-82m:8001
      - WORKER_URL_OPENAUDIO_S1_MINI=http://worker-openaudio-s1-mini:8001
      - WORKER_URL_WHISPER_BASE=http://worker-whisper-base:8001
    volumes:
      - ../config:/app/config:ro
      - cache_data:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Text workers (vLLM) ─────────────────────────────────────────────
  worker-qwen3-5-4b:
    <<: *gpu
    profiles: ["text", "qwen3.5-4b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.19.0}
        WORKER_REQUIREMENTS: deploy/workers/qwen3.5-4b/requirements.txt
    volumes:
      - ../config/models/qwen3.5-4b.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-text

  worker-qwen3-5-9b:
    <<: *gpu
    profiles: ["qwen3.5-9b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai:v0.19.0}
        WORKER_REQUIREMENTS: deploy/workers/qwen3.5-9b/requirements.txt
    volumes:
      - ../config/models/qwen3.5-9b.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-text

  worker-qwen3-8b:
    <<: *gpu
