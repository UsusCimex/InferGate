    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: build-essential
        WORKER_REQUIREMENTS: deploy/workers/qwen-image/requirements.txt
    volumes:
      - ../config/models/qwen-image.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
