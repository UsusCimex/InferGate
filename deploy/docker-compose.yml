    healthcheck: *hc-image

  worker-janus-pro-1b:
    <<: *gpu
    profiles: ["janus-pro-1b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: git
        WORKER_REQUIREMENTS: deploy/workers/janus-pro-1b/requirements.txt
    volumes:
      - ../config/models/janus-pro-1b.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
    env_file: *env-file
    environment: *env
    healthcheck: *hc-image

  worker-janus-pro-7b:
    <<: *gpu
    profiles: ["janus-pro-7b"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: git build-essential
        WORKER_REQUIREMENTS: deploy/workers/janus-pro-7b/requirements.txt
    volumes:
