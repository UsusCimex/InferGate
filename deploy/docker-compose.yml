  worker-z-image-turbo:
    <<: *gpu
    profiles: ["z-image-turbo"]
    build:
      <<: *build
      args:
        BASE_IMAGE: ${GPU_BASE_IMAGE:-pytorch/pytorch:2.7.1-cuda12.8-cudnn9-runtime}
        APT_PACKAGES: git build-essential
        WORKER_REQUIREMENTS: deploy/workers/z-image-turbo/requirements.txt
    volumes:
      - ../config/models/z-image-turbo.yaml:/app/config/model.yaml:ro
      - ${MODELS_DIR:-../models}:/app/models
