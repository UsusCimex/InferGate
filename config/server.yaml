log_level: info

auth:
  enabled: false
  api_keys: []

gpu:
  max_loaded_models: ${oc.decode:${oc.env:GPU_MAX_LOADED_MODELS,3}}
  pinned_models: []
  max_vram_budget_mb: ${oc.decode:${oc.env:GPU_MAX_VRAM_BUDGET_MB,0}}
  vram_headroom_mb: ${oc.decode:${oc.env:GPU_VRAM_HEADROOM_MB,0}}
  vram_budgets_mb: {}
  watchdog_interval_seconds: ${oc.decode:${oc.env:GPU_WATCHDOG_INTERVAL_SECONDS,15}}
  watchdog_vram_threshold: ${oc.decode:${oc.env:GPU_WATCHDOG_VRAM_THRESHOLD,0.92}}
  watchdog_ram_threshold: ${oc.decode:${oc.env:GPU_WATCHDOG_RAM_THRESHOLD,0.90}}
  category_reservations: {}
  worker_url_template: ${oc.env:GPU_WORKER_URL_TEMPLATE,''}

queue:
  max_size: 50

cache:
  enabled: true
  backend: ${oc.env:CACHE_BACKEND,local}
  redis_url: ${oc.env:CACHE_REDIS_URL,'redis://localhost:6379/0'}
  directory: "./cache"
  max_total_size_gb: 10
  eviction_policy: lru
  cleanup_interval_minutes: 30

cors:
  allow_origins: ["*"]
  allow_methods: ["*"]
  allow_headers: ["*"]
  allow_credentials: false

adapters:
  allowed_repos: ["*"]

models_dir: "./models"

defaults:
  image: sdxl-base
  text: qwen3.5-4b
  # kokoro is CPU-only and accepts /v1/audio/speech without reference_audio,
  # so it works out of the box; voice-cloning models live behind --profile voice-clone.
  tts: kokoro-82m
  stt: whisper-base
  upscale: realesrgan-x4
  embedding_text: multilingual-e5-base
  embedding_audio: clap-htsat-fused
  embedding_image: clip-vit-base-patch32
  embedding_video: clip4clip-webvid150k

rate_limit:
  enabled: ${oc.decode:${oc.env:RATE_LIMIT_ENABLED,false}}
  requests_per_minute: 60
  backend: ${oc.env:RATE_LIMIT_BACKEND,memory}

config_sync:
  enabled: ${oc.decode:${oc.env:CONFIG_SYNC_ENABLED,false}}

ui:
  enabled: ${oc.decode:${oc.env:UI_ENABLED,false}}
  history_size: 200
