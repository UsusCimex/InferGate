id: realesrgan-x4
display_name: "Real-ESRGAN 4×"
category: upscale
provider_class: SpandrelUpscaleProvider
enabled: ${oc.decode:${oc.env:REALESRGAN_X4_ENABLED,true}}

model:
  hub_id: "ai-forever/Real-ESRGAN"
  filename: "RealESRGAN_x4.pth"
  device: ${oc.env:REALESRGAN_X4_DEVICE,cuda}
  torch_dtype: ${oc.env:REALESRGAN_X4_TORCH_DTYPE,float16}
  vram_mb: ${oc.decode:${oc.env:REALESRGAN_X4_VRAM_MB,1500}}
  max_input_side: ${oc.decode:${oc.env:REALESRGAN_X4_MAX_INPUT_SIDE,2048}}

cache:
  enabled: true
  strategy: always
  ttl_hours: null
  max_size_mb: 2048

queue:
  priority: ${oc.env:REALESRGAN_X4_PRIORITY,medium}
  timeout_seconds: ${oc.decode:${oc.env:REALESRGAN_X4_TIMEOUT,120}}
  max_concurrent: ${oc.decode:${oc.env:REALESRGAN_X4_MAX_CONCURRENT,1}}

metadata:
  license: "BSD-3-Clause"
  description: "Real-ESRGAN x4 — general-purpose super-resolution via spandrel"
  tags: ["super-resolution", "upscale", "real-esrgan", "spandrel"]
