id: parakeet-tdt-0.6b-v2
display_name: "Parakeet TDT 0.6B v2"
category: stt
provider_class: ParakeetProvider
enabled: ${oc.decode:${oc.env:PARAKEET_TDT_06B_V2_ENABLED,true}}

model:
  hub_id: "istupakov/parakeet-tdt-0.6b-v2-onnx"
  asr_model: "nemo-parakeet-tdt-0.6b-v2"
  # int8 weights take ~0.7 GB instead of ~2.4 GB; an empty value loads the full-precision export.
  quantization: ${oc.env:PARAKEET_TDT_06B_V2_QUANTIZATION,int8}
  cpu_threads: ${oc.decode:${oc.env:PARAKEET_TDT_06B_V2_CPU_THREADS,0}}
  vram_mb: 0

cache:
  enabled: true
  strategy: always
  ttl_hours: null
  max_size_mb: 512

queue:
  priority: ${oc.env:PARAKEET_TDT_06B_V2_PRIORITY,high}
  timeout_seconds: ${oc.decode:${oc.env:PARAKEET_TDT_06B_V2_TIMEOUT,300}}
  max_concurrent: ${oc.decode:${oc.env:PARAKEET_TDT_06B_V2_MAX_CONCURRENT,2}}

metadata:
  license: CC-BY-4.0
  description: "NVIDIA Parakeet TDT 0.6B v2 (onnx-asr): English speech-to-text with punctuation"
  tags: ["parakeet", "stt", "cpu", "english"]
