id: flux1-schnell
display_name: "FLUX.1 Schnell"
category: image
provider_class: DiffusersImageProvider
enabled: ${oc.decode:${oc.env:FLUX1_SCHNELL_ENABLED,true}}

model:
  hub_id: "black-forest-labs/FLUX.1-schnell"
  revision: "main"
  torch_dtype: ${oc.env:FLUX1_SCHNELL_TORCH_DTYPE,bfloat16}
  vram_mb: ${oc.decode:${oc.env:FLUX1_SCHNELL_VRAM_MB,11000}}
  cpu_offload: ${oc.decode:${oc.env:FLUX1_SCHNELL_CPU_OFFLOAD,false}}
  sequential_cpu_offload: ${oc.decode:${oc.env:FLUX1_SCHNELL_SEQUENTIAL_OFFLOAD,true}}
  warmup: ${oc.decode:${oc.env:FLUX1_SCHNELL_WARMUP,true}}
  quantization: ${oc.decode:${oc.env:FLUX1_SCHNELL_QUANTIZATION,null}}
  default_params:
    num_inference_steps: ${oc.decode:${oc.env:FLUX1_SCHNELL_STEPS,4}}
    guidance_scale: ${oc.decode:${oc.env:FLUX1_SCHNELL_CFG,0.0}}
    width: 1024
    height: 1024

cache:
  enabled: true
  strategy: seed_only
  ttl_hours: null
  max_size_mb: 2048

queue:
  priority: ${oc.env:FLUX1_SCHNELL_PRIORITY,low}
  timeout_seconds: ${oc.decode:${oc.env:FLUX1_SCHNELL_TIMEOUT,600}}
  max_concurrent: ${oc.decode:${oc.env:FLUX1_SCHNELL_MAX_CONCURRENT,1}}

metadata:
  license: Apache-2.0
  description: "Fastest FLUX model, 4-step generation"
  tags: ["fast", "flux", "apache2"]
