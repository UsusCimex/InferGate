id: meissonic
display_name: "Meissonic"
category: image
provider_class: MeissonicImageProvider
enabled: ${oc.decode:${oc.env:MEISSONIC_ENABLED,true}}

model:
  hub_id: "MeissonFlow/Meissonic"
  revision: "main"
  torch_dtype: ${oc.env:MEISSONIC_TORCH_DTYPE,float16}
  vram_mb: ${oc.decode:${oc.env:MEISSONIC_VRAM_MB,10000}}
  default_params:
    num_inference_steps: ${oc.decode:${oc.env:MEISSONIC_STEPS,64}}
    guidance_scale: ${oc.decode:${oc.env:MEISSONIC_CFG,9.0}}
    width: ${oc.decode:${oc.env:MEISSONIC_WIDTH,1024}}
    height: ${oc.decode:${oc.env:MEISSONIC_HEIGHT,1024}}
    negative_prompt: ${oc.env:MEISSONIC_NEGATIVE_PROMPT,"worst quality, low quality, jpeg artifacts"}

cache:
  enabled: true
  strategy: seed_only
  ttl_hours: null
  max_size_mb: 2048

queue:
  priority: ${oc.env:MEISSONIC_PRIORITY,low}
  timeout_seconds: ${oc.decode:${oc.env:MEISSONIC_TIMEOUT,600}}
  max_concurrent: ${oc.decode:${oc.env:MEISSONIC_MAX_CONCURRENT,1}}

metadata:
  license: Apache-2.0
  description: "Meissonic — 1B masked non-autoregressive T2I, 1024×1024, Apache-2.0"
  tags: ["masked", "non-ar", "apache2"]
