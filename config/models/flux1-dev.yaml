id: flux1-dev
display_name: "FLUX.1 Dev"
category: image
provider_class: DiffusersImageProvider
enabled: ${oc.decode:${oc.env:FLUX1_DEV_ENABLED,true}}

model:
  hub_id: "black-forest-labs/FLUX.1-dev"
  revision: "main"
  torch_dtype: ${oc.env:FLUX1_DEV_TORCH_DTYPE,bfloat16}
  vram_mb: ${oc.decode:${oc.env:FLUX1_DEV_VRAM_MB,11000}}
  # 12B transformer + 5B T5 encoder cannot co-reside in 12GB at FP16. Model CPU
  # offload streams weights GPU↔RAM per-stage (~1.5-2× slower than no-offload).
  # On a big card: FLUX1_DEV_CPU_OFFLOAD=false.
  cpu_offload: ${oc.decode:${oc.env:FLUX1_DEV_CPU_OFFLOAD,false}}
  sequential_cpu_offload: ${oc.decode:${oc.env:FLUX1_DEV_SEQUENTIAL_OFFLOAD,true}}
  warmup: ${oc.decode:${oc.env:FLUX1_DEV_WARMUP,true}}
  quantization: ${oc.decode:${oc.env:FLUX1_DEV_QUANTIZATION,null}}
  default_params:
    num_inference_steps: ${oc.decode:${oc.env:FLUX1_DEV_STEPS,28}}
    guidance_scale: ${oc.decode:${oc.env:FLUX1_DEV_CFG,3.5}}
    width: 1024
    height: 1024

cache:
  enabled: true
  strategy: seed_only
  ttl_hours: null
  max_size_mb: 2048

queue:
  priority: ${oc.env:FLUX1_DEV_PRIORITY,low}
  timeout_seconds: ${oc.decode:${oc.env:FLUX1_DEV_TIMEOUT,900}}
  max_concurrent: ${oc.decode:${oc.env:FLUX1_DEV_MAX_CONCURRENT,1}}

metadata:
  license: "FLUX.1-dev Non-Commercial"
  description: "High quality FLUX model, 28-step generation"
  tags: ["quality", "flux", "non-commercial"]
