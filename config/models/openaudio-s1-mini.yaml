id: openaudio-s1-mini
display_name: "OpenAudio S1 Mini"
category: tts
provider_class: FishSpeechTtsProvider
enabled: ${oc.decode:${oc.env:OPENAUDIO_S1_MINI_ENABLED,false}}

model:
  hub_id: "fishaudio/openaudio-s1-mini"
  vram_mb: ${oc.decode:${oc.env:OPENAUDIO_S1_MINI_VRAM_MB,4000}}
  default_params:
    voice: ${oc.env:OPENAUDIO_S1_MINI_VOICE,default}
    speed: ${oc.decode:${oc.env:OPENAUDIO_S1_MINI_SPEED,1.0}}
    output_format: ${oc.env:OPENAUDIO_S1_MINI_OUTPUT_FORMAT,wav}

cache:
  enabled: true
  strategy: always
  ttl_hours: null
  max_size_mb: 1024

queue:
  priority: ${oc.env:OPENAUDIO_S1_MINI_PRIORITY,high}
  timeout_seconds: ${oc.decode:${oc.env:OPENAUDIO_S1_MINI_TIMEOUT,60}}
  max_concurrent: ${oc.decode:${oc.env:OPENAUDIO_S1_MINI_MAX_CONCURRENT,1}}

metadata:
  license: Apache-2.0
  description: "OpenAudio S1 Mini — 0.5B multilingual TTS by Fish Audio"
  tags: ["multilingual", "quality"]
