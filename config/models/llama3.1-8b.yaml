id: llama3.1-8b
display_name: "Llama 3.1 8B"
category: text
provider_class: VllmTextProvider
enabled: ${oc.decode:${oc.env:LLAMA3_1_8B_ENABLED,false}}

model:
  hub_id: "meta-llama/Llama-3.1-8B-Instruct"
  vram_mb: ${oc.decode:${oc.env:LLAMA3_1_8B_VRAM_MB,8000}}
  torch_dtype: ${oc.env:LLAMA3_1_8B_TORCH_DTYPE,float16}
  quantization: ${oc.decode:${oc.env:LLAMA3_1_8B_QUANTIZATION,null}}
  gpu_memory_utilization: ${oc.decode:${oc.env:LLAMA3_1_8B_GPU_MEM_UTIL,0.90}}
  context_length: ${oc.decode:${oc.env:LLAMA3_1_8B_CONTEXT_LENGTH,32768}}
  default_params:
    max_tokens: ${oc.decode:${oc.env:LLAMA3_1_8B_MAX_TOKENS,2048}}
    temperature: ${oc.decode:${oc.env:LLAMA3_1_8B_TEMPERATURE,0.7}}
    top_p: ${oc.decode:${oc.env:LLAMA3_1_8B_TOP_P,0.9}}

cache:
  enabled: false
  strategy: never

queue:
  priority: ${oc.env:LLAMA3_1_8B_PRIORITY,medium}
  timeout_seconds: ${oc.decode:${oc.env:LLAMA3_1_8B_TIMEOUT,60}}
  max_concurrent: ${oc.decode:${oc.env:LLAMA3_1_8B_MAX_CONCURRENT,1}}

metadata:
  license: "Llama 3.1 Community"
  description: "Meta Llama 3.1 8B Instruct"
  tags: ["meta", "llama"]
